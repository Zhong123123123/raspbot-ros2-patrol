raspbot_ultrasonic:
  ros__parameters:
    topic_name: ultrasonic/front
    frame_id: ultrasonic_link
    gpiochip: 0
    trig_pin: 23
    echo_pin: 24
    sample_rate: 8.0
    timeout_sec: 0.03
    settle_time_sec: 0.05
    min_range: 0.02
    max_range: 2.50
    field_of_view: 0.26
    temperature_c: 20.0
    median_window: 3
    publish_infinity_on_timeout: true
