name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: pip install ruff

      - name: Lint (ruff)
        run: ruff check src/

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # opencv<5 required: HOGDescriptor was removed in opencv 5.x
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "numpy>=1.26" "opencv-python-headless>=4.8,<5" pytest

      - name: Run unit tests
        run: |
          cd src/raspbot_vision
          python3 -m pytest test/ -v --tb=short --color=yes

      - name: Generate test report (JUnit XML)
        if: always()
        run: |
          cd src/raspbot_vision
          python3 -m pytest test/ -v --tb=short --junitxml=pytest-report.xml || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: src/raspbot_vision/pytest-report.xml
